<!DOCTYPE html>
<html>
<head>
  <tittle> For my Lizzy </tittle>
</head>
<body>
 <div id="PantallaContraseña">
  <h1>Ingrese la contraseña</h1>
  <input type="text" id="ClaveIngresada">
  <button onclick="verificarClave()">Entrar</button>
 </div>

 <div id="PantallaHuella" style="display:none">
  <h1>ACCESO RESTRINGIDO</h1>
  <button>Escanear</button>
 </div>
  
 <script>
   function verificarClave(){
     var clave = document.getElementById("ClaveIngresada").value;
     if (clave==="Verónica Lizzette Chávez Mendoza"){
       document.getElementById("PantallaContraseña").style.display="none";
       document.getElementById("PantallaHuella").style.display="block";
     }else{
       alert("Contraseña Incorrecta");
     }
   }
 </script>
</body>
</html>
